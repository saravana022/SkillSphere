version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillsphere-frontend
    restart: unless-stopped
    # No external ports, handled by nginx proxy
    depends_on:
      - backend
    networks:
      - frontend-nw

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsphere-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/skillsphere
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - frontend-nw
      - backend-nw

  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: skillsphere-db
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=skillsphere
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-nw
    # Hide from public internet by not exposing ports

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: skillsphere-cache
    restart: always
    networks:
      - backend-nw

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: skillsphere-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend-nw

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: skillsphere-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - backend-nw
  # Main Reverse Proxy (Nginx)
  nginx:
    image: nginx:stable-alpine
    container_name: skillsphere-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-nw

networks:
  frontend-nw:
  backend-nw:

volumes:
  mongodb_data:
  grafana_data:
